services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://gateway:gateway@db:5432/gateway
      BKASH_WEBHOOK_SECRET: ${BKASH_WEBHOOK_SECRET:-bkash-sandbox-secret}
      SSLCOMMERZ_WEBHOOK_SECRET: ${SSLCOMMERZ_WEBHOOK_SECRET:-sslcz-sandbox-secret}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_sandbox_secret}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    volumes:
      - gateway-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gateway-pgdata:
