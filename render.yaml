# Render blueprint: one-click deploy of the API with a managed PostgreSQL.
# https://render.com/docs/blueprint-spec
# Webhook retries need `python -m app.cli dispatch-webhooks --loop` running somewhere. Render
# background workers are not on the free plan, so add one as a paid `type: worker` service with
# dockerCommand set to that line. Without it, retries wait in the queue until a worker runs.
services:
  - type: web
    name: fastapi-payment-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: payment-gateway-db
          property: connectionString
      - key: BKASH_WEBHOOK_SECRET
        generateValue: true
      - key: SSLCOMMERZ_WEBHOOK_SECRET
        generateValue: true
      - key: STRIPE_WEBHOOK_SECRET
        generateValue: true

databases:
  - name: payment-gateway-db
    plan: free
    databaseName: gateway
    user: gateway
